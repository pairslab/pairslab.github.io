<article class="research-topic-card{{ if .external_reference }} is-external{{ end }}">
  <div class="research-topic-media is-{{ .fit | default "contain" }}">
    {{ with .demo }}
      <video data-research-loop autoplay muted loop playsinline preload="none"{{ with $.poster }} poster="{{ . | relURL }}"{{ end }} aria-hidden="true">
        <source data-src="{{ . | relURL }}" type="video/mp4">
      </video>
    {{ else }}
      <img src="{{ (.image | default .poster) | relURL }}" alt="{{ .alt | default .title }}" loading="lazy">
    {{ end }}
    <span class="research-topic-media-label">{{ .media_label }}</span>
  </div>

  <div class="research-topic-copy">
    <p class="research-topic-attribution">{{ .attribution }}</p>
    <h3>{{ .title }}</h3>
    <p>{{ .summary }}</p>
    {{ with .project_url }}
      <a href="{{ . }}" target="_blank" rel="noreferrer">{{ $.link_label }} <span aria-hidden="true">↗</span></a>
    {{ end }}
  </div>
</article>
