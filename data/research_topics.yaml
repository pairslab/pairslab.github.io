robust-autonomy:
  - title: Goal-Initialized Visual Navigation
    summary: A legged robot preserves directional awareness from a one-time goal and navigates cluttered indoor and outdoor scenes using depth and proprioceptive history.
    media_label: Field demo
    poster: images/publications/guide.jpg
    fit: contain
    demo: media/research/demos/guide-navigation.mp4
    source_asset: https://guide-navigation.github.io/public/assets/videos/web/wild_02_outdoor.mp4
    project_url: https://guide-navigation.github.io/
    link_label: Explore GUIDE
    attribution: PI co-authored work · 2026

  - title: All-Weather 3D Occupancy with 4D Radar
    summary: 4D imaging radar provides dense occupancy estimates through darkness, dusk, and snow, where camera- and LiDAR-based perception can degrade.
    media_label: Demo video
    poster: images/featured-radarocc.jpg
    fit: contain
    demo: media/research/demos/radarocc-snow.mp4
    source_asset: https://fangqiangding.com/publication/24-radarocc-neurips/resources/radarocc_gif_demo_snow.gif
    project_url: https://fangqiangding.com/publication/24-radarocc-neurips/
    link_label: Explore RadarOcc
    attribution: PI-led work · NeurIPS 2024

  - title: 4D Radar Scene Flow and Motion Understanding
    summary: Cross-modal supervision turns sparse 4D radar returns into scene flow, motion segmentation, and ego-motion for dynamic driving scenes.
    media_label: Demo video
    poster: images/publications/hidden-gems.jpg
    fit: contain
    demo: media/research/demos/hidden-gems-scene-flow.mp4
    source_asset: https://fangqiangding.com/publication/23-cmflow-cvpr/gifs/scene-flow/gif-1.gif
    project_url: https://fangqiangding.com/publication/23-cmflow-cvpr/
    link_label: Explore Hidden Gems
    attribution: PI-led work · CVPR 2023 Highlight

  - title: Agile Aerial Target Tracking
    summary: Fast-Tracker predicts target motion and plans collision-free trajectories so a UAV can follow an agile person through cluttered outdoor scenes.
    media_label: External native demo
    poster: images/research/topics/fast-tracker.jpg
    fit: contain
    demo: media/research/demos/fast-tracker.mp4
    source_asset: https://raw.githubusercontent.com/ZJU-FAST-Lab/Fast-tracker/main/figs/1.gif
    project_url: https://github.com/ZJU-FAST-Lab/Fast-Tracker
    link_label: Visit Fast-Tracker
    attribution: External reference · ZJU FAST Lab
    external_reference: true

human-sensing:
  - title: Multimodal Human Motion Capture
    summary: A synchronized benchmark aligns mmWave radar, RGB-D, and marker-based motion capture across daily, rehabilitation, and sports movements.
    media_label: Dataset demo
    poster: images/featured-m4human.jpg
    fit: contain
    demo: media/research/demos/m4human-capture.mp4
    source_asset: https://fanjunqiao.github.io/M4Human-site/static/dataset_videos/combined_output_depth_50.mp4
    project_url: https://fanjunqiao.github.io/M4Human-site/
    link_label: Explore M4Human
    attribution: PI co-authored work · CVPR 2026

  - title: Radar-Based Human Mesh Reconstruction
    summary: Radar tensors and point clouds are translated into articulated 3D body meshes without relying on visible-light imagery.
    media_label: Reconstruction demo
    poster: images/publications/m4human.jpg
    fit: contain
    demo: media/research/demos/m4human-reconstruction.mp4
    source_asset: https://fanjunqiao.github.io/M4Human-site/static/pred/1.mp4
    project_url: https://fanjunqiao.github.io/M4Human-site/
    link_label: View reconstruction
    attribution: PI co-authored work · CVPR 2026

  - title: Real-Time mmWave Skeletal Pose
    summary: mmPose reconstructs and tracks articulated human skeletons from compact mmWave radar measurements without relying on visible-light imagery.
    media_label: External native demo
    poster: images/research/topics/mmpose.jpg
    fit: contain
    demo: media/research/demos/mmpose.mp4
    source_asset: https://raw.githubusercontent.com/senguptaa/mmpose/master/Misc/mmpose.gif
    project_url: https://github.com/senguptaa/mmpose
    link_label: Visit mmPose
    attribution: External reference · University of Arizona
    external_reference: true

  - title: Thermal Egocentric Hand Pose
    summary: Thermal imagery recovers articulated 3D hand pose during object interactions and remains effective under darkness, glare, and handwear.
    media_label: Annotation demo
    poster: images/publications/thermohands.jpg
    fit: contain
    demo: media/research/demos/thermohands.mp4
    source_asset: https://thermohands.github.io/resources/annotation_2.mp4
    project_url: https://thermohands.github.io/
    link_label: Explore ThermoHands
    attribution: PI-led work · SenSys 2025

embodied-autonomy:
  - title: Progress-Aware Long-Horizon Control
    summary: PALM jointly predicts robot actions and continuous subtask progress, preserving temporal context throughout multi-step manipulation.
    media_label: Real-robot demo
    poster: images/research/topics/palm-real-world-setup.jpg
    fit: contain
    demo: media/research/demos/palm-progress.mp4
    source_asset: https://plan-lab.github.io/projects/palm/static/videos/original.mp4
    project_url: https://plan-lab.github.io/projects/palm/
    link_label: Explore PALM
    attribution: PI co-authored work · CVPR 2026

  - title: Structured Affordance Reasoning
    summary: Global, local, spatial, and dynamic affordance cues help the policy anticipate relevant interactions and act coherently in visually cluttered scenes.
    media_label: Robustness demo
    poster: images/research/topics/palm-method.jpg
    fit: contain
    demo: media/research/demos/palm-affordance.mp4
    source_asset: https://plan-lab.github.io/projects/palm/static/videos/visual-distraction.mp4
    project_url: https://plan-lab.github.io/projects/palm/#method
    link_label: View the method
    attribution: PI co-authored work · CVPR 2026

  - title: Robust Execution Under Change
    summary: PALM maintains coherent long-horizon behavior when task objects are relocated and the scene configuration changes.
    media_label: Robustness demo
    poster: images/research/topics/palm-robustness.jpg
    fit: contain
    demo: media/research/demos/palm-relocation.mp4
    source_asset: https://plan-lab.github.io/projects/palm/static/videos/random-relocation.mp4
    project_url: https://plan-lab.github.io/projects/palm/#videos
    link_label: Watch PALM rollouts
    attribution: PI co-authored work · CVPR 2026

  - title: Bimanual Mobile Imitation Learning
    summary: Mobile ALOHA learns whole-body bimanual household skills from low-cost human teleoperation, extending imitation learning beyond tabletop manipulation.
    media_label: External video reference
    poster: images/research/topics/mobile-aloha.jpg
    fit: contain
    demo: media/research/demos/mobile-aloha.mp4
    source_asset: https://mobile-aloha.github.io/static/images/preview.gif
    project_url: https://mobile-aloha.github.io/
    link_label: Visit Mobile ALOHA
    attribution: External reference · Stanford
    external_reference: true

scalable-physical-ai:
  - title: Physical Realism Failure Recognition
    summary: Physics-IQ tests whether generated videos obey principles spanning mechanics, fluids, optics, thermodynamics, and magnetism.
    media_label: External native demo
    poster: images/research/topics/physical-realism.jpg
    fit: contain
    demo: media/research/demos/physical-realism.mp4
    source_asset: https://physics-iq.github.io/assets/teaser.mp4
    project_url: https://physics-iq.github.io/
    link_label: Explore the benchmark
    attribution: External reference · Google DeepMind & INSAIT
    external_reference: true

  - title: Physics Signals in Diffusion Noise
    summary: Intermediate diffusion features contain signals that can predict physical plausibility and guide video generation toward more consistent motion.
    media_label: Comparison demo
    poster: images/publications/seeking-physics.jpg
    fit: contain
    demo: media/research/demos/seeking-physics.mp4
    source_asset: https://thegreatestcj.github.io/Physics-in-Noise/static/videos/ours_53.mp4
    project_url: https://thegreatestcj.github.io/Physics-in-Noise/
    link_label: Explore Seeking Physics
    attribution: PI co-authored work · 2026

  - title: Camera-Conditioned Radar Generation
    summary: RadarGen synthesizes realistic automotive radar point clouds from multi-view cameras while preserving geometry, motion, and occlusion structure.
    media_label: Generation demo
    poster: images/publications/radargen.jpg
    fit: contain
    demo: media/research/demos/radargen.mp4
    source_asset: https://radargen.github.io/static/videos/scene_2.mp4
    project_url: https://radargen.github.io/
    link_label: Explore RadarGen
    attribution: PI co-authored work · ECCV 2026

  - title: Gravity-Aligned 3D Geometry
    summary: G3T predicts upright, gravity-aligned pointmaps so long-sequence 3D reconstruction starts from a physically meaningful coordinate frame.
    media_label: External native demo
    poster: images/research/topics/g3t-pointmaps.jpg
    fit: contain
    demo: media/research/demos/g3t-pointmaps.mp4
    source_asset: https://g3t-paper.github.io/assets/videos/chunk_0.mp4
    project_url: https://g3t-paper.github.io/
    link_label: Explore G3T
    attribution: External reference · Cornell
    external_reference: true
