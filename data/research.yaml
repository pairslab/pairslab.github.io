- id: embodied-autonomy
  number: "02"
  slug: memory-aware-mobile-manipulation
  nav_title: Agentic Robotics
  label: Remember and act
  display_title: Long-Horizon Manipulation and Agentic Robotics
  paragraphs:
    - >-
      Our research focuses on long-horizon manipulation and agentic robotics, integrating perception, memory, task planning, and policy learning to enable robots to decompose goals, coordinate skills, and execute multi-step tasks. We investigate agents that monitor progress, adapt plans, and recover from failures under partial observability and changing environments. By coupling high-level reasoning with closed-loop control informed by visual and physical feedback, we aim to enable reliable and adaptive manipulation in the real world.
  outputs:
    - key: palm
      label: PALM · CVPR 2026
    - key: dexterous-survey
      label: Dexterous Manipulation Survey · T-ASE 2025

- id: human-sensing
  number: "03"
  slug: human-motion-and-affect-sensing
  nav_title: Human Interaction Sensing
  label: Sense motion and contact
  display_title: Human Motion and Physical Interaction Sensing
  paragraphs:
    - >-
      We develop multimodal sensing systems to understand human motion and physical interactions. By combining millimeter-wave radar, vision, wearable sensors, and force measurements, we capture movement, muscle activity, and interaction forces. Through synchronized data acquisition, sensor calibration, and multimodal learning, we build physically grounded representations to support robot learning, human–computer interaction, and rehabilitation.
