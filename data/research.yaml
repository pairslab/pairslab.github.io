- id: scalable-physical-ai
  number: "04"
  slug: scalable-robot-learning
  nav_title: Simulation & Robot Learning
  label: Synthesize and scale
  display_title: Generative Simulation and Robot Learning
  paragraphs:
    - >-
      Our research focuses on scalable robot learning through scene and data synthesis. By integrating 3D scene reconstruction, procedural generation, generative models, physics-based simulation, and motion planning, we construct diverse, interactive, and physically consistent virtual environments. Within these environments, we synthesize the visual observations, task specifications, action trajectories, and interaction feedback required for robot learning. Our research spans real-world scene digitization, simulation construction and randomization, task and behavior generation, synthetic-data quality assessment, policy learning, and sim-to-real transfer. We aim to transform limited real-world scenes and robot demonstrations into training environments and interaction data that can be systematically scaled across tasks, objects, and robot embodiments.
    - >-
      This research addresses the high cost of real-world robot data collection, the limited diversity of available environments and tasks, and the scarcity of long-tail interaction data. We investigate the relationships among scene semantics, physical properties, task objectives, and robot behavior. By closing the loop from real-world perception and scene synthesis to large-scale data generation, policy learning, and physical deployment, we seek to improve generalization to unseen objects, environments, and tasks. This research provides scalable data and environment infrastructure for general-purpose robotic manipulation, embodied intelligence, and robot foundation models.
  outputs:
    - key: physion-eval
      label: Physion-Eval · 2026
    - key: seeking-physics
      label: Seeking Physics in Diffusion Noise · 2026
    - key: radargen
      label: RadarGen · ECCV 2026
