  slug: robust-mobile-autonomy
  nav_title: Perception and Navigation
  label: Operate under extremes
  display_title: Robust Perception and Autonomous Navigation
  paragraphs:
    - >-
      Our research focuses on robust perception and autonomous navigation for safety-critical applications, including firefighting, disaster response, and emergency rescue. We develop learning-based and end-to-end navigation methods that combine multimodal perception with hazard-aware decision-making. By integrating complementary sensing modalities such as thermal imaging and radar, we aim to enable safe, adaptive, and reliable navigation despite poor visibility, extreme heat, dynamic hazards, and degraded sensor performance.
