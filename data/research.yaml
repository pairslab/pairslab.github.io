- id: embodied-autonomy
  number: "03"
  slug: memory-aware-mobile-manipulation
  nav_title: Long-Horizon Manipulation
  label: Remember and act
  display_title: Long-Horizon and Memory-Aware Mobile Manipulation
  paragraphs:
    - >-
      Our research focuses on long-horizon and memory-aware mobile manipulation. We develop learning-based systems that integrate perception, memory, navigation, and manipulation to carry out complex, multi-step tasks over extended periods. Our work spans scene understanding, memory representation and retrieval, decision-making, policy learning, and real-world deployment. We aim to enable robots to preserve temporal context, track task progress, adapt to changing operating conditions, and use past observations and interactions to guide future actions.
    - >-
      Long-horizon execution is challenging under incomplete observations and changing scene configurations, where errors can accumulate across subtasks. Reactive policies that rely primarily on current observations often struggle to maintain coherent long-horizon behavior and recover from execution failures. We investigate memory-aware representations and policies that connect past experience and scene understanding with decisions over extended action sequences. By integrating perception, memory, navigation, and manipulation into a closed loop, we seek to develop reliable embodied agents that can operate robustly and adaptively in the real world.
