    - key: milliflow
      label: milliFlow · ECCV 2024

- id: scalable-physical-ai
  number: "04"
  slug: scalable-robot-learning
  nav_title: Simulation & Robot Learning
  label: Synthesize and scale
  display_title: Generative Simulation and Robot Learning
  paragraphs:
    - >-
      Our research focuses on generative simulation and robot learning through a real–sim–real pipeline. We reconstruct real-world scenes and use generative models to create diverse virtual environments. Physics-based simulation provides interaction data for policy learning, and we investigate the transfer of learned policies to real robots. We aim to reduce data collection costs and improve generalization to new objects, tasks, environments, and robot platforms.
