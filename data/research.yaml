- id: human-sensing
  number: "03"
  slug: human-motion-and-affect-sensing
  nav_title: Human Interaction Sensing
  label: Sense motion and contact
  display_title: Human Motion and Physical Interaction Sensing
  paragraphs:
    - >-
      Our research focuses on human motion and physical interaction sensing. We integrate millimeter-wave radar, vision, surface electromyography (sEMG), inertial sensing, and force sensing to capture body and hand motion, muscle activity, contact events, and interaction forces. Through synchronized data acquisition, sensor calibration, and multimodal learning, we develop physically grounded representations of human movement and interaction to support learning for robotic manipulation, human–computer interaction, and rehabilitation.
