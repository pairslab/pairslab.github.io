- id: human-sensing
  number: "02"
  slug: human-motion-and-affect-sensing
  nav_title: Human Interaction Sensing
  label: Sense motion and contact
  display_title: Human Motion and Physical Interaction Sensing
  paragraphs:
    - >-
      Our research focuses on sensing and understanding human motion and human–environment physical interactions. We develop multimodal sensing systems that integrate millimetre-wave radar, computer vision, surface electromyography (sEMG), inertial sensing, and force sensing to capture human and hand movements, muscle activity, contact events, and interaction forces. Our work encompasses the entire technical pipeline, from synchronized multimodal data acquisition, sensor calibration, and dataset development to multimodal learning and real-time state estimation. We aim to derive informative representations of human actions, interaction states, and behavioral intent from heterogeneous sensor data.
    - >-
      By moving beyond motion-only representations, we seek to characterize the relationships among movement, muscle activation, physical contact, and force during human motion and dexterous manipulation. These physically grounded representations provide richer and more complete information about human behavior for robot manipulation learning, with broader applications in human–computer interaction and rehabilitation.
