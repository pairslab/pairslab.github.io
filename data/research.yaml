- id: robust-autonomy
  number: "01"
  slug: robust-mobile-autonomy
  nav_title: Mobile Autonomy
  label: Operate under extremes
  display_title: Robust Mobile Autonomy for Challenging and Safety-Critical Environments
  paragraphs:
    - >-
      Our laboratory focuses on robust mobile autonomy for challenging and safety-critical environments, including firefighting, disaster response, emergency rescue, and other extreme scenarios. These environments represent some of the most demanding yet impactful applications of robotics, where autonomous systems can reduce human exposure to danger, extend operational capabilities beyond human limits, and support faster and safer emergency response. However, smoke, darkness, heat, dynamic hazards, uncertain terrain, and sensor degradation can fundamentally challenge conventional robotic autonomy. While modular pipelines for perception, localization, planning, and control have been extensively studied, their performance often depends on reliable intermediate modules and predefined environmental assumptions. Our research explores learning-based and end-to-end autonomy, with emphasis on multimodal perception, robust representations, hazard-aware decision making, and policy learning. By integrating complementary sensing such as thermal imaging and radar, we aim to develop robotic systems that can operate safely, adaptively, and reliably in environments where conventional autonomy is most likely to fail.
